<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Neon Harvest — collect the light, survive the swarm</title>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        height: 100%;
        background: #02020a;
        overflow: hidden;
      }
      body {
        display: flex;
        align-items: center;
        justify-content: center;
        font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
      }
      #wrap {
        position: relative;
        width: min(100vw, 150vh);
        height: min(100vh, 66.6667vw);
      }
      canvas {
        display: block;
        width: 100%;
        height: 100%;
        image-rendering: auto;
        cursor: crosshair;
        background: #050510;
      }
      #status {
        position: absolute;
        left: 8px;
        bottom: 6px;
        color: rgba(148, 163, 184, 0.7);
        font-size: 12px;
        pointer-events: none;
      }
    </style>
  </head>
  <body>
    <div id="wrap">
      <canvas id="game" width="960" height="640"></canvas>
      <div id="status">Neon Harvest · WASD move · mouse aim · click / Space fire · P pause · M mute</div>
    </div>
    <script type="module" src="main.js"></script>
  </body>
</html>
